<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Get the current path and query string
      var path = window.location.pathname.replace('/portfolio', '');
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.href = '/portfolio/?path=' + encodeURIComponent(path + search + hash);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
